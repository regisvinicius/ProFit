name: profit-pipeline   

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    Build: 
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build

